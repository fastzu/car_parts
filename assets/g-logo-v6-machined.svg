<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p { animation: slide 5s infinite both; }
    @keyframes slide {
      0%   { transform: translate(var(--x), var(--y)); opacity: 0; animation-timing-function: cubic-bezier(.16,1,.3,1); }
      30%  { transform: translate(0,0); opacity: 1; }
      86%  { transform: translate(0,0); opacity: 1; }
      100% { transform: translate(0,0); opacity: 0; }
    }
    .top  { --x: 0px;    --y: -240px; animation-delay: 0s; }
    .bot  { --x: 0px;    --y: 240px;  animation-delay: .12s; }
    .hook { --x: 260px;  --y: 0px;    animation-delay: .34s; }
  </style>

  <rect width="500" height="500" rx="40" fill="#101214"/>

  <g transform="translate(-10 0)">
    <!-- الجسم العلوي -->
    <path class="p top" fill="#FF7A00"
      d="M390 120H180L130 170V268L196 232V216L226 186H390Z"/>
    <!-- الجسم السفلي -->
    <path class="p bot" fill="#FF7A00"
      d="M130 276V330L180 380H390V314H226L196 284V240Z"/>
    <!-- قطعة الذراع -->
    <path class="p hook" fill="#EFEDE8"
      d="M298 232H390V308H324V290H270V260Z"/>
  </g>
</svg>
